<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Regime Intelligence</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#17253b;font:16px/1.5 system-ui,sans-serif}nav{padding:12px 20px;background:white;border-bottom:1px solid #dce3ec;display:flex;flex-wrap:wrap;gap:12px;align-items:center}nav strong{margin-right:auto}a,button{color:#185a8d}button{border:1px solid #dce3ec;background:white;border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#185a8d;color:white}.meta{padding:8px 20px;color:#5f6c80;font-size:13px}iframe{border:0;width:100%;display:block;height:1px;background:white}
</style></head><body><nav><button data-file="latest.html" aria-pressed="true">Latest report</button><button data-file="previous-day.html" aria-pressed="false">Previous trading day</button><a id="open-report" href="latest.html">Open full report</a></nav><div class="meta">Latest: Oct 12, 2026 · 11:37 AM ET · Previous trading day: 2026-10-09</div><iframe id="report" src="latest.html" title="Latest market report" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe><script>
const frame=document.getElementById('report'),openLink=document.getElementById('open-report');
function resize(){try{const doc=frame.contentDocument,content=doc.querySelector('main')||doc.body;const bottom=content.getBoundingClientRect().bottom+doc.defaultView.scrollY;const margin=parseFloat(doc.defaultView.getComputedStyle(content).marginBottom)||0;frame.style.height=Math.ceil(bottom+margin)+'px'}catch{}}
let observer;frame.addEventListener('load',()=>{if(observer)observer.disconnect();resize();try{observer=new ResizeObserver(resize);observer.observe(frame.contentDocument.querySelector('main')||frame.contentDocument.body)}catch{}});window.addEventListener('resize',resize);
document.querySelectorAll('button[data-file]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('button[data-file]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));frame.src=b.dataset.file+'?v='+Date.now();frame.title=b.textContent;openLink.href=b.dataset.file;}));
</script></body></html>
