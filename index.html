<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Regime Intelligence</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#17253b;font:16px/1.5 system-ui,sans-serif}nav{position:sticky;top:0;z-index:100;padding:12px 20px;background:white;border-bottom:1px solid #dce3ec;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}a,button{color:#185a8d}button,nav a{border:1px solid #dce3ec;background:white;border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer}nav a{text-decoration:none}button[aria-pressed=true]{background:#185a8d;color:white}iframe{border:0;width:100%;display:block;height:1px;background:white}
</style></head><body><nav><button data-file="latest.html" aria-pressed="true">Latest Report</button><button data-file="previous-day.html" aria-pressed="false">Previous Trading Day</button><a id="open-report" href="latest.html?v=30c185839dcf6653">Open Full Report</a></nav><iframe id="report" src="latest.html?v=30c185839dcf6653" title="Latest market report" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe><script>
/* Trusted publication UI. This code never asserts that a task is running. */
(function (global) {
  'use strict';
  function updateNextReportStatus(doc, now) {
    const element = doc && doc.querySelector('[data-next-update-at]');
    if (!element || !element.dataset.nextUpdateAt) return;
    const target = new Date(element.dataset.nextUpdateAt);
    now = now || new Date();
    if (!Number.isFinite(target.getTime())) return;
    const options = {timeZone: 'America/New_York'};
    const date = new Intl.DateTimeFormat('en-US', {...options, month:'short', day:'numeric', year:'numeric'}).format(target);
    const clock = new Intl.DateTimeFormat('en-US', {...options, hour:'numeric', minute:'2-digit', hour12:true}).format(target);
    const time = date + ' · ' + clock + ' ET';
    if (element.dataset.reportHistory === 'true') {
      element.textContent = 'Next Scheduled After This Report: ' + time + ' · Historical Report';
      return;
    }
    const grace = Number(element.dataset.overdueMinutes || 10) * 60000;
    const late = now.getTime() - target.getTime();
    const label = late < 0 ? 'Next Scheduled Update' : late < grace ? 'Scheduled Update Due' : 'Scheduled Update Overdue';
    element.textContent = label + ': ' + time;
  }
  global.updateNextReportStatus = updateNextReportStatus;
  // The sandboxed report iframe is updated by its parent. A direct full-report
  // page runs this same audited UI itself, without enabling scripts in the iframe.
  if (typeof document !== 'undefined' && global.top === global.self) {
    const refresh = () => updateNextReportStatus(document);
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', refresh);
    else refresh();
    global.setInterval(refresh, 30000);
    document.addEventListener('visibilitychange', refresh);
  }
})(typeof window !== 'undefined' ? window : globalThis);

const reportVersion='30c185839dcf6653';
const frame=document.getElementById('report'),openLink=document.getElementById('open-report');
function resize(){try{const doc=frame.contentDocument,content=doc.querySelector('main')||doc.body;const bottom=content.getBoundingClientRect().bottom+doc.defaultView.scrollY;const margin=parseFloat(doc.defaultView.getComputedStyle(content).marginBottom)||0;frame.style.height=Math.ceil(bottom+margin)+'px'}catch{}}
let observer;frame.addEventListener('load',()=>{if(observer)observer.disconnect();try{updateNextReportStatus(frame.contentDocument)}catch{}resize();try{observer=new ResizeObserver(resize);observer.observe(frame.contentDocument.querySelector('main')||frame.contentDocument.body)}catch{}});window.addEventListener('resize',resize);
document.querySelectorAll('button[data-file]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('button[data-file]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));const url=b.dataset.file+'?v='+reportVersion+'-'+Date.now();frame.src=url;frame.title=b.textContent;openLink.href=url;}));
function refreshNextUpdate(){try{updateNextReportStatus(frame.contentDocument)}catch{}}
setInterval(refreshNextUpdate,30000);document.addEventListener('visibilitychange',refreshNextUpdate);
</script></body></html>
