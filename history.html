<script>
'use strict';
const history=JSON.parse(document.getElementById('history-data').textContent).observations;
const scale=['VERY_LOW','LOW','MODERATE_LOW','MODERATE','MODERATE_HIGH','HIGH'];
const names={'VERY_LOW':'Very Low','LOW':'Low','MODERATE_LOW':'Moderate–Low','MODERATE':'Moderate','MODERATE_HIGH':'Moderate–High','HIGH':'High'};
const dirVal={BEARISH:-1,NEUTRAL:0,BULLISH:1};
const colors={BEARISH:'#b94747',NEUTRAL:'#66758c',BULLISH:'#168453'};
const periods=[['1D',1],['5D',5],['1M',30],['3M',90],['All',Infinity]];
let active=5, selected=null;
const filters=document.getElementById('filters');
for(const [label,days] of periods){const button=document.createElement('button');button.textContent=label;button.type='button';button.setAttribute('aria-pressed',String(days===active));button.addEventListener('click',()=>{active=days;document.querySelectorAll('#filters button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));draw();});filters.append(button);}
const NS='http://www.w3.org/2000/svg';
function node(parent,tag,attrs={},label){const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,String(v));if(label!==undefined)n.textContent=label;parent.append(n);return n;}
function show(p){selected=p;const el=document.getElementById('detail');el.replaceChildren();if(!p){el.textContent='No archived observations in this period.';return;}const title=document.createElement('strong');title.textContent=new Date(p.at).toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'});const body=document.createElement('div');body.textContent=p.direction+' · '+names[p.confidence]+' confidence · '+p.type.replaceAll('_',' ');el.append(title,body);}
function draw(){const last=history.length?new Date(history[history.length-1].at).getTime():Date.now();const pts=history.filter(p=>active===Infinity||new Date(p.at).getTime()>=last-active*86400000);for(const id of ['direction','confidence'])document.getElementById(id).replaceChildren();if(!pts.length){show(null);return;}
const min=new Date(pts[0].at).getTime(),max=new Date(pts[pts.length-1].at).getTime(),range=Math.max(3600000,max-min);const x=p=>72+660*(new Date(p.at).getTime()-min)/range;const yDir=p=>({BULLISH:35,NEUTRAL:90,BEARISH:145})[p.direction];const yConf=p=>160-(p.confidence_level-1)*26;
function axis(svg,labels){for(const [label,y] of labels){node(svg,'line',{x1:72,y1:y,x2:734,y2:y,stroke:'#dce3ec','stroke-dasharray':'3 4'});node(svg,'text',{x:64,y:y+4,'font-size':12,'text-anchor':'end',fill:'#526174'},label);}const ticks=Math.min(5,pts.length);for(let i=0;i<ticks;i++){const p=pts[Math.round(i*(pts.length-1)/Math.max(1,ticks-1))];node(svg,'text',{x:x(p),y:177,'font-size':11,'text-anchor':'middle',fill:'#526174'},new Date(p.at).toLocaleDateString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric'}));}}
const d=document.getElementById('direction'),c=document.getElementById('confidence');
axis(d,[['Bullish',35],['Neutral',90],['Bearish',145]]);
axis(c,[['High',30],['Moderate',82],['Low',134]]);
for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];node(d,'path',{d:'M'+x(a)+' '+yDir(a)+' H'+x(b)+' V'+yDir(b),fill:'none',stroke:colors[b.direction],'stroke-width':2.5});node(c,'line',{x1:x(a),y1:yConf(a),x2:x(b),y2:yConf(b),stroke:'#216e91','stroke-width':2.5});}
for(const p of pts){for(const [svg,y,color] of [[d,yDir(p),colors[p.direction]],[c,yConf(p),'#216e91']]){const point=node(svg,'circle',{cx:x(p),cy:y,r:5,fill:color,stroke:'#fff','stroke-width':1.5,tabindex:0,role:'button','aria-label':p.at+' '+p.direction+' '+names[p.confidence]});point.addEventListener('click',()=>show(p));point.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(p);}});}}
show(pts[pts.length-1]);}
draw();
